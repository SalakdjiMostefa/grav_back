server.port=8080

# Profil actif par défaut : mysql (vous pouvez le changer en postgres ou h2)
spring.profiles.active=mysql

# Nom de l'application
spring.application.name=grav_back

# Configuration upload de fichiers (images cosmétiques)
aura.upload.dir=./uploads/products
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs
logging.level.com.aura=INFO
logging.level.org.springframework.web=INFO
